name: Agent-Native Service Tests On Main

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-native-tests:
    name: agent-native tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        run: python -m pytest tests/agent_native -q

      - name: Installer smoke
        run: ./scripts/test_install.sh

      - name: MCP stdio smoke
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          request = {"jsonrpc": "2.0", "id": 1, "method": "tools/list", "params": {}}
          proc = subprocess.run(
              [sys.executable, "-m", "stockvaluation_agent_native.mcp_server"],
              input=json.dumps(request) + "\n",
              text=True,
              capture_output=True,
              check=True,
          )
          response = json.loads(proc.stdout)
          names = {tool["name"] for tool in response["result"]["tools"]}
          required = {
              "stockvaluation.health",
              "stockvaluation.value_ticker",
              "stockvaluation.recalculate",
          }
          missing = required - names
          if missing:
              raise SystemExit(f"Missing MCP tools: {sorted(missing)}")
          print(f"MCP tools/list smoke passed with {len(names)} tools")
          PY

  valuation-service-tests:
    name: valuation-service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: valuation-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B -ntp test

  yfinance-tests:
    name: yfinance tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yfinance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: yfinance/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: |
          if [ -d tests ] && find tests -type f -name "test_*.py" | grep -q .; then
            pytest -q tests
          else
            echo "No tests found for yfinance. Skipping."
          fi
