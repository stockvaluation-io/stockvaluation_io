name: Agent-Native Service Tests On Main

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-native-tests:
    name: agent-native tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        run: python -m pytest tests/agent_native -q

      - name: Installer smoke
        run: ./scripts/test_install.sh

  valuation-service-tests:
    name: valuation-service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: valuation-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B -ntp test

  yfinance-tests:
    name: yfinance tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yfinance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: yfinance/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: |
          if [ -d tests ] && find tests -type f -name "test_*.py" | grep -q .; then
            pytest -q tests
          else
            echo "No tests found for yfinance. Skipping."
          fi
